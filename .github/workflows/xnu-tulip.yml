name: xnu-tulip

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: VINCE
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "tools/patch_dxb.py"
      - ".github/workflows/xnu-tulip.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: '13.5'
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'VINCE' }}

jobs:
  build:
    # macos-14 ships Xcode 15.x whose iig matches the xnu-8796 IORPC ABI
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # Copy Vince-specific and open-source Darwin patches
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # Patch dxb/build.sh: arm64 support for libfirehose and target-aware patch basename loop for Vince
          python3 tools/patch_dxb.py dxb/build.sh
          grep -c 'VALID_ARCHS="arm64"' dxb/build.sh
          ls dxb/patches

      - name: Dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build XNU Kernel for tulip (VINCE machine config + 0185 tulip patch)
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          echo "MACOS_VERSION=[$MACOS_VERSION] KERNEL_CONFIG=[$KERNEL_CONFIG] MACHINE_CONFIG=[$MACHINE_CONFIG]"
          bash build.sh

      - name: Package build tree
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform || true
          ls -la buildtree.tgz || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Collect Output
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-tulip
          path: out/
          if-no-files-found: warn

  payload:
    # Kernel + ADT -> payload, and the boot shim. Runs on Linux, no Apple tooling needed.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel-tulip
          path: kernel
      - name: Tools
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          sudo sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
          sudo sh -c 'echo "nameserver 1.1.1.1" >> /etc/resolv.conf'
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          # Runner'da zaten var; yoksa 3 kez dene, DNS hatasında patlama
          if ! command -v clang >/dev/null || ! command -v ld.lld >/dev/null \
             || ! command -v llvm-objcopy >/dev/null; then
            for i in 1 2 3; do
              sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update -qq && \
              sudo apt-get -o Acquire::Retries=5 -y -qq install clang lld llvm && break
              echo "apt denemesi $i başarısız, 15s bekleyip tekrar..."; sleep 15
            done
          fi
          clang --version | head -1
          ld.lld --version
          llvm-objcopy --version | head -1

      - name: ADT + payload + shim
        run: |
          set -e
          ls -la kernel
          K=$(ls kernel/kernel.development.vince kernel/kernel.development 2>/dev/null | head -1)
          test -n "$K"
          mkdir -p out
          python3 -I tools/mkadt_tulip.py out/tulip.adt
          python3 -I tools/verify_adt_tulip.py out/tulip.adt
          python3 -I tools/mkpayload_tulip.py "$K" out/tulip.adt out/tulip.payload
          # shim only (no stock boot image in CI): build with the same flags as shim-tulip/build.py
          cd shim-tulip && mkdir -p ../out/shimobj
          for s in start.S shim.c console.c mmu.c fdt.c loader.c; do
            clang -target aarch64-none-elf -O2 -ffreestanding -fno-builtin -nostdlib -fno-pic -mgeneral-regs-only -mstrict-align -fno-stack-protector -DFB_BPP=32 -DBOOT_XNU=1 -I . -c $s -o ../out/shimobj/${s%.*}.o
          done
          ld.lld -T shim.ld --build-id=none -N -o ../out/shimobj/shim.elf ../out/shimobj/*.o
          llvm-objcopy -O binary ../out/shimobj/shim.elf ../out/tulip-shim-boot.bin
          cd .. && rm -rf out/shimobj && ls -la out && sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: tulip-payload
          path: out/
